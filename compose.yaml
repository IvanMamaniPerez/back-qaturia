name: back-qaturia

x-app-environment: &app-environment
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-base64:y6aO8oLRu8s3n8ZsZ4gHY5t3f7fR9m7qQ0L7V7p5YJ4=}
    APP_URL: http://localhost:${APP_PORT:-8000}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-back_qaturia}
    DB_USERNAME: ${DB_USERNAME:-back_qaturia}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-back-qaturia}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-secret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    REVERB_SCALING_ENABLED: 'true'
    OCTANE_SERVER: frankenphp
    VITE_PORT: ${VITE_PORT:-5174}
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-key}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
    VITE_REVERB_PORT: ${REVERB_PUBLIC_PORT:-8080}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}

x-php-service: &php-service
    image: back-qaturia-app
    build:
        context: .
        target: app
    environment: *app-environment
    volumes:
        - .:/app
        - app-vendor:/app/vendor
        - app-storage:/app/storage
        - app-bootstrap-cache:/app/bootstrap/cache

services:
    workspace:
        <<: *php-service
        command: ['tail', '-f', '/dev/null']
        depends_on:
            setup:
                condition: service_completed_successfully
        healthcheck:
            disable: true
        restart: 'no'

    setup:
        <<: *php-service
        healthcheck:
            disable: true
        command:
            - sh
            - -c
            - >-
                until php -r "exit(@fsockopen('postgres', 5432) ? 0 : 1);"; do sleep 1; done;
                php artisan migrate --force && php artisan storage:link --force
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: 'no'

    app:
        <<: *php-service
        command:
            - php
            - artisan
            - octane:frankenphp
            - --host=0.0.0.0
            - --port=8000
            - --admin-port=2019
            - --workers=1
            - --max-requests=1
            - --watch
            - --poll
        ports:
            - ${APP_PORT:-8000}:8000
        depends_on:
            setup:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s
        restart: unless-stopped

    reverb:
        <<: *php-service
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - ${REVERB_PUBLIC_PORT:-8080}:8080
        depends_on:
            setup:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "$$socket = @fsockopen('127.0.0.1', 8080); exit($$socket === false ? 1 : 0);",
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        restart: unless-stopped

    queue:
        <<: *php-service
        healthcheck:
            disable: true
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=1',
                '--tries=3',
                '--timeout=90',
            ]
        depends_on:
            setup:
                condition: service_completed_successfully
        restart: unless-stopped

    scheduler:
        <<: *php-service
        healthcheck:
            disable: true
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            setup:
                condition: service_completed_successfully
        restart: unless-stopped

    vite:
        image: back-qaturia-frontend
        build:
            context: .
            target: frontend
        environment: *app-environment
        command:
            - sh
            - -c
            - npm run dev -- --host=0.0.0.0 --port=$${VITE_PORT}
        healthcheck:
            disable: true
        volumes:
            - .:/app
            - app-vendor:/app/vendor
            - app-node-modules:/app/node_modules
            - app-storage:/app/storage
            - app-bootstrap-cache:/app/bootstrap/cache
        ports:
            - ${VITE_PORT:-5174}:${VITE_PORT:-5174}
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-back_qaturia}
            POSTGRES_USER: ${DB_USERNAME:-back_qaturia}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - ${DB_FORWARD_PORT:-5433}:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - ${REDIS_FORWARD_PORT:-6380}:6379
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - ${MAILPIT_SMTP_FORWARD_PORT:-1026}:1025
            - ${MAILPIT_DASHBOARD_PORT:-8025}:8025
        restart: unless-stopped

volumes:
    app-vendor:
    app-node-modules:
    app-storage:
    app-bootstrap-cache:
    postgres-data:
    redis-data:
