name: qaturia

x-app-runtime: &app-runtime
  image: qaturia-api:${IMAGE_TAG:-local}
  env_file:
    - .env
  working_dir: /var/www
  networks:
    - qaturia
  restart: unless-stopped

services:
  app:
    <<: *app-runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HTTP_SERVER: ${APP_HTTP_SERVER:-octane}
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s
    volumes:
      - app-storage:/var/www/storage

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qaturia}
      POSTGRES_USER: ${DB_USERNAME:-qaturia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: America/Lima
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - qaturia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qaturia} -d ${DB_DATABASE:-qaturia}"]
      interval: 5s
      timeout: 4s
      retries: 15
    expose:
      - "5432"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - qaturia
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    expose:
      - "6379"

  queue:
    <<: *app-runtime
    profiles: ["workers"]
    command: ["php", "artisan", "queue:work", "redis", "--queue=broadcasts,notifications,default", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-runtime
    profiles: ["workers"]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *app-runtime
    profiles: ["realtime"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      redis:
        condition: service_healthy

networks:
  qaturia:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  app-storage:
