[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/qaturia-supervisord.pid
user=root

[program:qaturia-nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qaturia-http]
; Actual mode is APP_HTTP_SERVER=artisan (bootstrap) or octane (Swoole).
command=/usr/local/bin/qaturia/run-http.sh
directory=/var/www
user=qaturia
environment=HOME="/var/www",USER="qaturia"
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
